<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ session.get('_csrf', '') }}">
<title>{% block title %}LogStore RocksDB{% endblock %}</title>
<style>
  :root { --bg:#f4f6f8; --panel:#fff; --line:#d9e0e7; --ink:#18222d; --muted:#617080; --blue:#2458bd; --red:#b42318; --green:#18794e; }
  * { box-sizing:border-box }
  body { margin:0; color:var(--ink); background:var(--bg); font:14px/1.5 system-ui,"Segoe UI",sans-serif }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px max(18px,calc((100% - 1160px)/2)); display:flex; gap:18px; align-items:center; flex-wrap:wrap }
  header h1 { margin:0; font-size:18px; flex:1 }
  header p { margin:0; color:var(--muted) }
  nav { display:flex; gap:12px; align-items:center }
  nav a { color:var(--blue); text-decoration:none }
  main { max-width:1160px; margin:20px auto; padding:0 16px; display:grid; gap:14px }
  .section { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:16px }
  .section h2 { margin:0 0 12px; font-size:16px }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:end }
  label { display:flex; flex-direction:column; gap:4px; min-width:120px; color:var(--muted); font-size:12px }
  input,select,textarea { max-width:100%; padding:8px 9px; border:1px solid #bfc9d4; border-radius:6px; color:var(--ink); background:#fff; font:inherit }
  button,.button { display:inline-block; border:1px solid var(--blue); border-radius:6px; padding:8px 12px; color:#fff; background:var(--blue); font:inherit; text-decoration:none; cursor:pointer }
  button.secondary,.button.secondary { color:var(--blue); background:#fff }
  button.danger { border-color:var(--red); background:#fff; color:var(--red) }
  button:disabled { cursor:not-allowed; opacity:.55 }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px }
  .stat { border-bottom:2px solid var(--line); padding:5px 8px }
  .stat strong { display:block; font-size:22px; font-variant-numeric:tabular-nums }
  .stat span,.muted { color:var(--muted); font-size:12px }
  .table-wrap { overflow:auto; margin-top:12px }
  table { width:100%; border-collapse:collapse; min-width:760px }
  th,td { padding:8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top }
  th { color:var(--muted); font-size:12px }
  td.ts { white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--muted) }
  .level { font-weight:700 }
  .level.DEBUG { color:#617080 } .level.INFO { color:#18794e } .level.WARN { color:#a15c00 } .level.ERROR { color:#b42318 } .level.FATAL { color:#7c2d91 }
  .actions { white-space:nowrap }
  .actions button { padding:4px 8px; margin-right:4px; font-size:12px }
  .status { min-height:22px; margin-top:8px; color:var(--muted) }
  .error { color:var(--red) }
  dialog { width:min(560px,calc(100% - 24px)); border:1px solid var(--line); border-radius:10px; padding:18px }
  dialog::backdrop { background:#15202b99 }
  @media(max-width:640px) { header { align-items:flex-start } header h1 { flex-basis:100% } main { margin:12px auto } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <h1><a href="/" style="color:inherit;text-decoration:none">LogStore · RocksDB</a></h1>
  {% if user %}
  <p>{{ user.username }} · {{ user.role }}</p>
  <nav>
    {% if user.role == 'admin' %}<a href="/users">Quản lý người dùng</a>{% endif %}
    <form method="post" action="/logout" style="margin:0">
      <input type="hidden" name="csrf_token" value="{{ session.get('_csrf', '') }}">
      <button class="secondary" type="submit">Đăng xuất</button>
    </form>
  </nav>
  {% endif %}
</header>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
