{% extends "base.html" %}
{% block title %}Khởi tạo LogStore{% endblock %}
{% block auth %}
<h1>Tạo quản trị viên đầu tiên</h1>
<p class="muted">Trang này chỉ mở khi cơ sở dữ liệu chưa có tài khoản nào.</p>
<form method="post" action="/setup" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Tên đăng nhập<input name="username" minlength="3" maxlength="32" autocomplete="username" required></label>
  <label>Mật khẩu<input name="password" type="password" minlength="10" autocomplete="new-password" required aria-describedby="passwordRule"></label>
  <span id="passwordRule" class="hint">Tối thiểu 10 ký tự.</span>
  <label>Nhập lại mật khẩu<input name="confirm_password" type="password" minlength="10" autocomplete="new-password" required></label>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <button class="primary">Tạo quản trị viên</button>
</form>
{% endblock %}
