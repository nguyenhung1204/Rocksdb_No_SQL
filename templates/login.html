{% extends "base.html" %}
{% block title %}Đăng nhập LogStore{% endblock %}
{% block auth %}
<h1>Đăng nhập</h1>
<p class="muted">Dùng tài khoản do quản trị viên cấp.</p>
<form method="post" action="/login" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Tên đăng nhập<input name="username" autocomplete="username" required></label>
  <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <button class="primary">Đăng nhập</button>
</form>
{% endblock %}
